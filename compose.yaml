services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aca-prod:local
    init: true
    ports:
      - "127.0.0.1:${GOLDEN_HOUR_PORT:-8123}:8080"
    environment:
      SERVICE_VERSION: "${SERVICE_VERSION:-0.0.0-local}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
