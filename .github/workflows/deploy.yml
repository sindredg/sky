name: deploy

# terraform/** would also match the application stack, which release.yml owns,
# and the bootstrap root, which only a human applies.
on:
  pull_request:
    paths:
      - 'terraform/stacks/platform/**'
      - 'terraform/environments/**'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/stacks/platform/**'
      - 'terraform/environments/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

# Serialises applies on main so two runs cannot race the state lock.
concurrency:
  group: deploy-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: platform plan
    # A fork pull request receives no OIDC token, so skip rather than fail.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: initialize
        run: >-
          terraform -chdir=terraform/stacks/platform init
          -backend-config=backend.hcl -input=false

      - name: plan
        run: >-
          terraform -chdir=terraform/stacks/platform plan -input=false -no-color
          -var-file=../../environments/production/platform.tfvars

  apply:
    name: platform apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: initialize
        run: >-
          terraform -chdir=terraform/stacks/platform init
          -backend-config=backend.hcl -input=false

      - name: apply
        run: >-
          terraform -chdir=terraform/stacks/platform apply -input=false -no-color
          -auto-approve -var-file=../../environments/production/platform.tfvars
