name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: install
        run: pip install -r app/requirements-dev.txt

      # Timezone lookups read system tzdata, which a runner may not ship.
      - name: verify timezone data is available
        run: python -c "from zoneinfo import ZoneInfo; ZoneInfo('Europe/Oslo')"

      - name: tests
        run: python -m pytest app/tests -q

  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: install
        run: pip install ruff==0.16.4

      - name: format check
        run: ruff format --check app

      - name: lint
        run: ruff check app

  terraform:
    name: terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: format check
        run: terraform fmt -check -recursive terraform

      - name: initialize and validate roots
        shell: bash
        run: |
          set -euo pipefail
          for root in terraform/bootstrap terraform/stacks/platform; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate -no-color
          done
