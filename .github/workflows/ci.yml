name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: install
        run: pip install -r app/requirements-dev.txt

      # Timezone lookups read system tzdata, which a runner may not ship.
      - name: verify timezone data is available
        run: python -c "from zoneinfo import ZoneInfo; ZoneInfo('Europe/Oslo')"

      - name: tests
        run: python -m pytest app/tests -q

  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install
        run: pip install ruff==0.16.4

      - name: format check
        run: ruff format --check app

      - name: lint
        run: ruff check app
