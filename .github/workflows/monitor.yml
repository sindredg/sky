name: monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-production
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://ca-aca-prod-production.yellowglacier-15588c53.norwayeast.azurecontainerapps.io

jobs:
  smoke:
    name: production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: verify the public service
        run: python3 scripts/deployment_smoke.py "$PRODUCTION_URL"
