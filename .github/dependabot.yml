version: 2

updates:
  # Actions are pinned to commit SHAs, which never float. Without this, a pinned
  # action is frozen until someone notices a deprecation notice in a run log.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'

  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'
