[pytest]
# A warning nobody reads is a warning that hides the next one.
#
# The single ignore is upstream and not ours to fix: starlette 1.6.0, the
# newest release, imports anyio.abc.BlockingPortal, which the newest anyio
# deprecates. Both are current, so no pairing of versions avoids it, and
# pinning anyio backwards would only set Dependabot against CI. Remove this
# when starlette moves to anyio.from_thread.BlockingPortal.
filterwarnings =
    error
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning
